name: Rust cache (save)
description: >
  Saves the Cargo registry and target/ under the key that ../action.yml
  computed, without Aurora's own build outputs. For main only (pull requests
  and queue runs read main's caches and write none, see ci.yml).
inputs:
  key:
    description: The key output of ../action.yml
    required: true
runs:
  using: composite
  steps:
    # Aurora's crates are rebuilt by whoever restores the cache: the script
    # says why, and what it removes in each of Cargo's two layouts. It warns
    # when it finds none of the workspace's outputs.
    - name: Drop the workspace's own outputs
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/drop-workspace-outputs.sh"
    # the same paths as ../action.yml (see there)
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ inputs.key }}
