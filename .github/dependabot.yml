# Weekly update PRs for the Rust crates and the GitHub actions, so the
# project never falls behind (an agent checks them, and merges them once
# its human agrees).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [maintenance]
    commit-message:
      prefix: "chore(deps)"
    # held for sccache, see crates/aurora-viewer/Cargo.toml
    ignore:
      - dependency-name: mimalloc
      - dependency-name: libmimalloc-sys
    groups:
      crates-mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [maintenance]
    commit-message:
      prefix: "chore(ci)"
