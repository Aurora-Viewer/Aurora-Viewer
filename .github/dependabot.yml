# Weekly update PRs for the Rust crates, the Rust version and the GitHub
# actions, so the project never falls behind (an agent checks them, and
# merges them once its human agrees).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [maintenance]
    commit-message:
      prefix: "chore(deps)"
    # held for sccache, see crates/aurora-viewer/Cargo.toml
    ignore:
      - dependency-name: mimalloc
      - dependency-name: libmimalloc-sys
    groups:
      crates-mineures:
        update-types: [minor, patch]

  # the version of rust-toolchain.toml: one PR per new stable release, and
  # every PC and the CI change version together when it is merged
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    labels: [maintenance]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [maintenance]
    commit-message:
      prefix: "chore(ci)"
