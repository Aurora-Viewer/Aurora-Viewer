name: Bug Report
description: Report a bug in Aurora
title: "[Bug]: "
labels: ["BUG REPORT"]
body:
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: What steps are required to reproduce the problem?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true

  - type: input
    id: viewer-version
    attributes:
      label: Viewer version
      placeholder: e.g., v2.4.1
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: Operating system and graphics card (if it is a rendering issue)
      placeholder: e.g., Windows 11, Intel I9-14900K, NVIDIA GeForce RTX 3080, 32GB
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: Attachments (Logs, Screenshots, or Files)
      description: |
        **WARNING:** All uploaded files are **PUBLIC** and visible to everyone on the internet. 
        Do **NOT** upload sensitive information, private logs, passwords, or personal data. 
        Attach only public screenshots or sanitized logs.
    validations:
      required: false
