name: Security

# cargo-deny: advisories (the accepted risks are listed with a review date in
# deny.toml), licences, sources and bans. A pull request that adds a crate
# with a known advisory fails; the weekly run catches advisories published
# since the last commit, and the yanked crates the next update must replace.
#
# A maintainer looks at the weekly run, the CodeQL alerts and the Dependabot
# pull requests every week (HUMANS.md, "Security").
on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@094a77a254a15132dbeb0fb0744a2307f086e063 # v2.1.3
        with:
          command: check
          # --locked: the pull request's Cargo.lock is the one shipped. Do not
          # pass --all-features: the graph is the published build's.
          arguments: --locked
          # the workspace's toolchain (rust-toolchain.toml); kept explicit so
          # the action's older default does not trip on edition 2024
          rust-version: '1.100.0'
          log-level: warn
