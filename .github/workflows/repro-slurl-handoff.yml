# TEMPORARY (task slurl-handoff-flaky, removed before the merge): counts the
# failures of the Linux hand-over over the session bus, the old way of
# serving the object (lazy) against the new one (builder), in one build.
name: Repro slurl hand-off

on:
  push:
    branches: [fix/slurl-handoff-flaky]

permissions:
  contents: read

concurrency:
  group: repro-slurl-handoff
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      # main's cache of the Linux tests (a push restores no partial match
      # through the shared action, so the key is spelled out here)
      - id: key
        shell: bash
        run: |
          rustc=$(rustc -V | awk '{ print $2 "-" substr($3, 2) }')
          echo "prefix=cargo-v1-linux-tests-${{ runner.os }}-${{ runner.arch }}-$rustc-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.prefix }}none
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Build the tests
        run: |
          cargo test --profile ci --workspace --locked --no-run --message-format=json > build.json
          for exe in $(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null and .package_id != null) | select(.target.name | test("aurora.viewer")) | .executable' build.json); do
            if "$exe" --list --ignored 2>/dev/null | grep -q repro_handoff_loop; then echo "BIN=$exe" >> "$GITHUB_ENV"; echo "test binary: $exe"; fi
          done
      - name: Environment
        run: |
          nproc; lscpu | grep 'Model name' || true
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unset}"
          ls -la "/run/user/$(id -u)" || true
          ps -eo pid,args | grep -i dbus | grep -v grep || true
      - name: A. Alone
        run: |
          for round in 1 2 3 4 5; do
            REPRO_MODE=lazy REPRO_ITER=100 "$BIN" --ignored --exact slurl_handoff::tests::repro_handoff_loop --nocapture 2>&1 | grep REPRO || true
            REPRO_MODE=builder REPRO_ITER=100 "$BIN" --ignored --exact slurl_handoff::tests::repro_handoff_loop --nocapture 2>&1 | grep REPRO || true
          done
      - name: B. One CPU shared with three busy loops
        run: |
          for i in 1 2 3; do taskset -c 0 sh -c 'while :; do :; done' & done
          for round in 1 2 3 4; do
            REPRO_MODE=lazy REPRO_ITER=50 taskset -c 0 "$BIN" --ignored --exact slurl_handoff::tests::repro_handoff_loop --nocapture 2>&1 | grep REPRO || true
            REPRO_MODE=builder REPRO_ITER=50 taskset -c 0 "$BIN" --ignored --exact slurl_handoff::tests::repro_handoff_loop --nocapture 2>&1 | grep REPRO || true
          done
          fails=0
          for i in $(seq 1 50); do
            taskset -c 0 timeout 120 "$BIN" --exact slurl_handoff::tests::closing_viewer_refuses_links > out.txt 2>&1 || { fails=$((fails+1)); tail -5 out.txt; }
          done
          echo "REAL TEST pinned: 50 runs, $fails failed"
          kill $(jobs -p) || true
      - name: C. Beside the viewer's whole suite
        run: |
          "$BIN" --skip repro_handoff_loop > suite.txt 2>&1 &
          suite=$!
          while kill -0 $suite 2>/dev/null; do
            REPRO_MODE=lazy REPRO_ITER=25 "$BIN" --ignored --exact slurl_handoff::tests::repro_handoff_loop --nocapture 2>&1 | grep REPRO || true
            REPRO_MODE=builder REPRO_ITER=25 "$BIN" --ignored --exact slurl_handoff::tests::repro_handoff_loop --nocapture 2>&1 | grep REPRO || true
          done
          wait $suite && echo "suite: ok" || echo "suite: FAILED"
          grep -E "slurl_handoff|test result" suite.txt || true
      - name: D. The real test alone
        run: |
          fails=0
          for i in $(seq 1 100); do
            timeout 120 "$BIN" --exact slurl_handoff::tests::closing_viewer_refuses_links > out.txt 2>&1 || { fails=$((fails+1)); tail -5 out.txt; }
          done
          echo "REAL TEST alone: 100 runs, $fails failed"
