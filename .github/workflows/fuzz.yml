name: Fuzz

# Coverage-guided fuzzing (libFuzzer, through cargo-fuzz on nightly Rust) of
# the readers of untrusted data: assets and messages any resident or
# simulator can send (fuzz/, docs/TESTING.md "Fuzzing"). Every night, each
# target runs for a fixed time from its corpus, kept between runs; an input
# that panics, hangs, overflows memory or trips AddressSanitizer (OpenJPEG
# is C) fails the job and is uploaded as an artifact. Never a check of pull
# requests: those that change fuzz/ only build the targets and read the
# seeds.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: '600'
  pull_request:
    paths:
      - fuzz/**
      - .github/workflows/fuzz.yml

permissions:
  contents: read

jobs:
  seeds:
    # The targets build and read their seeds (on stable, like fuzz-local).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      # fuzz/ resolves from the viewer's Cargo.lock: the shipped versions of
      # every shared crate, kept current by Dependabot (a lock of its own
      # fell behind at each update of the crates fuzz/ uses by path)
      - name: Shipped dependency versions
        run: cp Cargo.lock fuzz/Cargo.lock
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: false
      - name: Seeds read by every target
        run: cargo test --release --manifest-path fuzz/Cargo.toml --lib

  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [j2k, mesh, anim, llsd, material, packet, object, prim, volume, sculpt, terrain, sound, misc]
    env:
      SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - name: Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          cargo install cargo-fuzz --locked
      # fuzz/ resolves from the viewer's Cargo.lock: the shipped versions of
      # every shared crate, kept current by Dependabot (a lock of its own
      # fell behind at each update of the crates fuzz/ uses by path)
      - name: Shipped dependency versions
        run: cp Cargo.lock fuzz/Cargo.lock
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      # The corpus libFuzzer grew in earlier runs, plus the current seeds.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seeds
        run: cargo run --release --manifest-path fuzz/Cargo.toml --bin fuzz-local -- --write-seeds
      # -O: fuzz/Cargo.toml's release profile, overflow checks in our crates
      # only (without it cargo-fuzz turns them on in every dependency)
      - name: Fuzz
        run: >-
          cargo +nightly fuzz run -O ${{ matrix.target }} --features libfuzzer --
          -max_total_time=${{ env.SECONDS_PER_TARGET }}
          -timeout=10 -rss_limit_mb=4096 -malloc_limit_mb=1024
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
