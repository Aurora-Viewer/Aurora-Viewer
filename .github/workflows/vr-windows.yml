name: Windows VR test build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/vr-windows.yml'
      - 'crates/aurora-render/**'
      - 'crates/aurora-viewer/**'
      - 'Cargo.lock'
      - 'docs/VR_WINDOWS.md'

  # Fork pushes provide a preflight build before upstream approves PR workflows.
  push:
    paths:
      - '.github/workflows/vr-windows.yml'
      - 'crates/aurora-render/**'
      - 'crates/aurora-viewer/**'
      - 'Cargo.lock'
      - 'docs/VR_WINDOWS.md'

permissions:
  contents: read

concurrency:
  group: vr-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    if: github.event_name != 'push' || github.event.repository.fork
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Rust stable
        run: |
          ./.github/drop-extra-targets.ps1
          rustup update stable --no-self-update
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-vr-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Windows Clippy (warnings are errors)
        run: cargo clippy --profile ci --locked --workspace --all-targets -- -D warnings
      - name: Build viewer and OpenXR interoperability sample
        run: cargo build --profile ci --locked --workspace --bin aurora-viewer --example xr_spike
      - name: Shared VR logic tests
        run: |
          cargo test --profile ci --locked --workspace --lib stereo_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --profile ci --locked --workspace --lib vr_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload maintainer test executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-vr-test
          retention-days: 14
          if-no-files-found: error
          path: |
            target/ci/aurora-viewer.exe
            target/ci/examples/xr_spike.exe
            docs/VR_WINDOWS.md
