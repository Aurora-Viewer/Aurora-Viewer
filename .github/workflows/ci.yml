name: CI

# Two stages. A pull request gets the quick checks (formatting, clippy,
# secrets) while its author reviews it. The full run (tests too) happens in
# the merge queue, on the PR combined with the latest main: what lands on
# main is exactly what was tested, and nobody has to update a branch.
#
# A push to main is the commit the queue has just tested: its Windows jobs
# neither lint nor test it again. They only rebuild the Rust cache when its
# key changed (Cargo.lock, toolchain), because the caches are written from
# main alone (see rust-cache below) and a queue run cannot share its own.
# The Linux job, which the queue skips for a change with nothing of Linux's
# own (the platform-needed action), runs in full on main instead.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# a push to main that has started is never cancelled (as in macos.yml): when
# the cache key changed, its jobs build the cache from nothing for about ten
# minutes, and the next merge would otherwise cancel them before they save
# it. A push still waiting is replaced by the next one all the same: GitHub
# keeps one pending run per group. So a hung run of main holds every later
# push back until it ends, hence the timeouts of the jobs and of the cache
# saves below (a save hung 6 hours on 2026-11-04)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # Every job always reports (main requires them); their Rust steps are
    # skipped when only documentation or assets changed.
    name: fmt, clippy (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # the whole history (the version is read from the last tag, and the
      # changed files from the base), without the files of other commits:
      # the captures branch alone weighs hundreds of MB
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Code changed?
        id: changes
        uses: ./.github/actions/code-changed
      # the runner's toolchain carries two more targets (gnu, i686) that
      # every update would download again for nothing
      - name: Rust stable
        if: steps.changes.outputs.code == 'true'
        run: |
          ./.github/drop-extra-targets.ps1
          rustup update stable --no-self-update
          rustup component add rustfmt clippy
      # caches are written from main only, and read by every PR and queue
      # run: PR caches would otherwise evict main's from the 10 GB quota.
      # Not Swatinem/rust-cache: .github/actions/rust-cache says why
      - uses: ./.github/actions/rust-cache
        id: cache
        if: steps.changes.outputs.code == 'true'
        with:
          name: lint
      # Windows PowerShell 5.1, the one the Aurora tools run with
      - name: PowerShell scripts parse
        if: steps.changes.outputs.code == 'true' && github.event_name != 'push'
        shell: powershell
        run: ./scripts/check-scripts.ps1
      - name: Formatting
        if: steps.changes.outputs.code == 'true' && github.event_name != 'push'
        run: cargo fmt --all -- --check
      # profile "ci" (Cargo.toml): unoptimized, no debug info, built fast;
      # on main, only when the cache has to be written again (see the top)
      - name: Clippy (warnings are errors)
        if: steps.changes.outputs.code == 'true' && (github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true')
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings
      # a few seconds to a minute; hung for hours once (see concurrency)
      - name: Save the Rust cache
        if: steps.changes.outputs.code == 'true' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        # a cache that is not saved only slows the next run: never a red job
        timeout-minutes: 10
        continue-on-error: true
        uses: ./.github/actions/rust-cache/save
        with:
          key: ${{ steps.cache.outputs.key }}

  lint-linux:
    # The Linux code paths (media plugins' shared memory and keyboard, the
    # Unix permissions of the packs…) are never built on Windows: clippy on
    # Linux keeps them compiling. A pull request runs the tests of the two
    # crates whose Linux paths differ; the merge queue runs the workspace's
    # tests. No agent can run them locally. Both only when the change has
    # Linux code, a dependency or a build file (platform-needed): otherwise
    # the job ends in seconds. A push to main runs clippy and every test,
    # the net for what that guess misses.
    name: clippy (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Linux needed?
        id: changes
        uses: ./.github/actions/platform-needed
        with:
          platform: linux
      # ALSA for the sound, the rest for winit's X11 / Wayland back ends
      - name: System libraries
        if: steps.changes.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        if: steps.changes.outputs.needed == 'true'
        run: |
          rustup update stable --no-self-update
          rustup component add clippy
      # the key is named, not the job's: the old one holds clippy's output
      # only, and main, finding it, would never build the tests into it
      # (as in macos.yml)
      - uses: ./.github/actions/rust-cache
        id: cache
        if: steps.changes.outputs.needed == 'true'
        with:
          name: linux-tests
      # dead code is the Windows job's: Windows-only helpers (system probes,
      # toasts…) build here without their callers. Not in the queue: the
      # pull request ran it, Windows lints the combined code, and the tests
      # below build it (about 6 of the job's 17 minutes)
      - name: Clippy (warnings are errors)
        if: steps.changes.outputs.needed == 'true' && github.event_name != 'merge_group'
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings -A dead-code
      # pull requests: the quick tests of the media host and the updater
      - name: Tests of the media host and the updater
        if: steps.changes.outputs.needed == 'true' && github.event_name == 'pull_request'
        run: cargo test --profile ci --locked -p aurora-media -p aurora-updater
      # main: build the tests and save the cache before running them, so
      # that the queue compiles the workspace and not its dependencies, even
      # when a test fails
      - name: Build the tests (cache)
        if: steps.changes.outputs.needed == 'true' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: cargo test --profile ci --workspace --locked --no-run
      - name: Save the Rust cache
        if: steps.changes.outputs.needed == 'true' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        # a cache that is not saved only slows the next run: never a red job
        timeout-minutes: 10
        continue-on-error: true
        uses: ./.github/actions/rust-cache/save
        with:
          key: ${{ steps.cache.outputs.key }}
      # the merge queue and main: the whole workspace, beside the Windows and
      # macOS jobs (on pull requests it would take CI from ~4 to ~15
      # minutes). The Linux-only tests (the secondlife:// handler, its
      # hand-over over the session bus) and the Linux paths of the others
      # cannot run on the agents' PCs. None needs a display or a session bus.
      - name: Tests
        if: steps.changes.outputs.needed == 'true' && github.event_name != 'pull_request'
        run: cargo test --profile ci --workspace --locked

  windows-runner:
    # The runner of the interface part below, in the merge queue only: the
    # team's self-hosted runner (label aurora-mini, 10 cores, its build
    # folder kept between runs) when it is online and idle, GitHub's
    # otherwise, so that the queue never waits for a machine that is off.
    # Never on pull requests: they could run anyone's code on it. Listing
    # the runners needs the Administration permission, which GITHUB_TOKEN
    # cannot have: RUNNERS_TOKEN is a fine-grained token with Administration
    # read on this repository only. Without it, GitHub's runner.
    name: pick the Windows runner
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      interface: ${{ steps.pick.outputs.interface }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNERS_TOKEN }}
        run: |
          runner='"windows-latest"'
          if [ -n "$GH_TOKEN" ] &&
             free=$(gh api "repos/${{ github.repository }}/actions/runners" --jq '[.runners[] | select(.status == "online" and (.busy | not) and any(.labels[]; .name == "aurora-mini"))] | length') &&
             [ "$free" -gt 0 ]; then
            runner='["self-hosted", "aurora-mini"]'
          fi
          echo "interface: $runner"
          echo "interface=$runner" >> "$GITHUB_OUTPUT"

  tests:
    # Not on pull requests: the agent ran them locally (check.ps1) and the
    # merge queue runs them on the combined code before anything lands.
    #
    # The run is split in three parts on three runners, each building the
    # tests itself in about 5 minutes (the build is the same, the cache
    # too): the chat tests of the viewer (`ui::chat::`, about 4 minutes of
    # running), its other interface tests (`ui::`, about 4 minutes) and
    # everything else (about 3 minutes). Filters and `--skip` are exact
    # complements, so every test of every binary runs in one part and only
    # one, whatever modules are added later; a new module only moves the
    # balance. The interface part may run on the self-hosted runner (see
    # windows-runner); main's cache builds stay on GitHub's runners.
    name: tests (Windows, ${{ matrix.part }})
    needs: windows-runner
    # windows-runner is skipped outside the queue: run anyway
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.part == 'interface' && needs.windows-runner.outputs.interface && fromJSON(needs.windows-runner.outputs.interface) || 'windows-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: chat
            filter: "ui::chat::"
          - part: interface
            filter: "ui:: --skip ui::chat::"
          - part: rest
            filter: "--skip ui::"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # self-hosted: the tools the steps below call, named in one clear
      # error rather than a bare "command not found" midway. Windows
      # PowerShell, the one shell every Windows machine has; a service sees
      # a new system PATH only after a reboot
      - name: Tools of the self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $missing = @('bash', 'git', 'pwsh', 'cargo', 'rustup') | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          if ($missing) {
            Write-Output "::error::self-hosted runner $env:RUNNER_NAME lacks: $($missing -join ', ') (PATH seen by the service: $env:PATH)"
            exit 1
          }
          (Get-Command bash).Source
      - name: Code changed?
        id: changes
        uses: ./.github/actions/code-changed
      - name: Rust stable
        if: steps.changes.outputs.code == 'true' && (github.event_name != 'push' || matrix.part == 'interface')
        run: |
          ./.github/drop-extra-targets.ps1
          rustup update stable --no-self-update
      # self-hosted: the build folder stays between runs, outside the
      # checkout (which `git clean` empties), and takes no cache; it is
      # emptied when the disk runs low
      - name: Build folder (self-hosted)
        if: steps.changes.outputs.code == 'true' && runner.environment == 'self-hosted'
        # PowerShell 7 named: Windows PowerShell's >> writes UTF-16, which
        # GITHUB_ENV does not read
        shell: pwsh
        run: |
          $target = Join-Path (Split-Path $env:RUNNER_WORKSPACE) 'aurora-target'
          $drive = Get-PSDrive (Split-Path $target -Qualifier).TrimEnd(':')
          if ($drive.Free -lt 40GB) {
            Write-Host "Less than 40 GB free: emptying $target"
            Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          }
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
      # the parts share one cache, written by the interface part on main
      - uses: ./.github/actions/rust-cache
        id: cache
        if: steps.changes.outputs.code == 'true' && runner.environment == 'github-hosted' && (github.event_name != 'push' || matrix.part == 'interface')
        with:
          name: tests
      - name: Tests (${{ matrix.part }})
        if: steps.changes.outputs.code == 'true' && github.event_name != 'push'
        run: cargo test --profile ci --workspace --locked -- ${{ matrix.filter }}
      # main: build the tests without running them, for the cache only
      # (one part writes it, the others have nothing to do)
      - name: Build the tests (cache)
        if: steps.changes.outputs.code == 'true' && github.event_name == 'push' && matrix.part == 'interface' && steps.cache.outputs.cache-hit != 'true'
        run: cargo test --profile ci --workspace --locked --no-run
      - name: Save the Rust cache
        if: steps.changes.outputs.code == 'true' && github.event_name == 'push' && matrix.part == 'interface' && steps.cache.outputs.cache-hit != 'true'
        # a cache that is not saved only slows the next run: never a red job
        timeout-minutes: 10
        continue-on-error: true
        uses: ./.github/actions/rust-cache/save
        with:
          key: ${{ steps.cache.outputs.key }}

  tests-result:
    # The check that main requires: green when every part passed (or was
    # skipped, on a pull request), red otherwise.
    name: tests (Windows)
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Every part
        run: |
          echo "parts: ${{ needs.tests.result }}"
          case "${{ needs.tests.result }}" in success|skipped) ;; *) exit 1 ;; esac

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action: the action needs a paid
      # licence for repositories owned by an organization.
      - name: Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" ;;
            merge_group)  range="${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}" ;;
            *)            range="${{ github.event.before }}..${{ github.sha }}" ;;
          esac
          # a new branch has no "before": scan its whole history
          case "$range" in 0000000000000000000000000000000000000000..*) range="${{ github.sha }}" ;; esac
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --log-opts="$range" --redact --verbose --exit-code 1 .
