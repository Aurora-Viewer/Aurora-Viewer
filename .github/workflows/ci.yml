name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # The job always reports (main requires it); its Rust steps are skipped
    # when only documentation or assets changed.
    name: fmt, clippy, tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Code changed?
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # documentation, images and repository metadata do not need a build
          docs='^(docs/|assets/|[^/]*\.md$|LICENSE$|\.github/(pull_request_template\.md|release\.yml|dependabot\.yml)$)'
          if files=$(git diff --name-only "$base" HEAD 2>/dev/null) && [ -n "$files" ] && ! echo "$files" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only: Rust checks skipped."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rust stable
        if: steps.changes.outputs.code == 'true'
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'
      - name: Formatting
        if: steps.changes.outputs.code == 'true'
        run: cargo fmt --all -- --check
      # profile "ci" (Cargo.toml): unoptimized, no debug info, built fast
      - name: Clippy (warnings are errors)
        if: steps.changes.outputs.code == 'true'
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings
      - name: Tests
        if: steps.changes.outputs.code == 'true'
        run: cargo test --profile ci --workspace --locked

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action: the action needs a paid
      # licence for repositories owned by an organization.
      - name: Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" ;;
            merge_group)  range="${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}" ;;
            *)            range="${{ github.event.before }}..${{ github.sha }}" ;;
          esac
          # a new branch has no "before": scan its whole history
          case "$range" in 0000000000000000000000000000000000000000..*) range="${{ github.sha }}" ;; esac
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --log-opts="$range" --redact --verbose --exit-code 1 .
