name: CodeQL

# Static analysis of the Rust code and of the workflows. The Rust database is
# built without compiling (build-mode: none, CodeQL 2.23.3+); the workflows
# are analysed as YAML. The security-extended suite adds the queries of the
# default one plus stricter checks (path traversal, command injection, TLS
# checks, hard-coded secrets…).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '13 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise
        uses: github/codeql-action/init@e0462179768953fd6790193e15caaef674ff709e # v4.39.4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@e0462179768953fd6790193e15caaef674ff709e # v4.39.4
        with:
          category: '/language:rust'

  actions:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise
        uses: github/codeql-action/init@e0462179768953fd6790193e15caaef674ff709e # v4.39.4
        with:
          languages: actions
      - name: Analyse
        uses: github/codeql-action/analyze@e0462179768953fd6790193e15caaef674ff709e # v4.39.4
        with:
          category: '/language:actions'
