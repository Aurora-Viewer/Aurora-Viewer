name: Media plugins

# Builds the packs of media plugins used by the viewer, one per system, from
# a pinned commit of the Legacy Viewer sources (the Linden Lab binaries, LGPL
# 2.1) and the prebuilt packages that commit names in its autobuild.xml, the
# ones the Legacy Viewer ships:
# - Windows: SLPlugin.exe, media_plugin_cef.dll (web through CEF / Dullahan),
#   media_plugin_libvlc.dll (video and audio through LibVLC);
# - Linux: SLPlugin, libmedia_plugin_cef.so, libmedia_plugin_gstreamer.so.
#   That commit builds no LibVLC plugin for Linux and there is no Linux VLC
#   package: video goes through the system's GStreamer, as in the Legacy
#   Viewer.
# - macOS (universal, arm64 and x86_64, as the Legacy Viewer builds it):
#   SLPlugin.app with media_plugin_cef.dylib, media_plugin_libvlc.dylib, CEF's
#   framework, the Dullahan helpers and LibVLC in its Contents/Frameworks,
#   signed ad hoc.
# Run by hand: the packs only change with these pins. With "publish", both
# packs go to the release media-plugins-<PACK_VERSION>, whose size and SHA-256
# the viewer then pins per system (aurora-updater media_pack.rs). Publish
# from main: GitHub refuses this workflow's token a tag on a commit that
# changes workflow files, as a branch that edits this file does (pack 2 was
# built on such a branch and its artifacts published by hand).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packs as the release media-plugins-<PACK_VERSION>
        type: boolean
        default: false

permissions:
  contents: write

env:
  PACK_VERSION: '3'
  FIRESTORM_SHA: c33bfee253160cceefdb7c98d864fbb736e8ed9a
  BUILD_VARIABLES_SHA: c17312d38377c003977cf5b6dcc83c6042eba194
  AUTOBUILD_VSVER: '170'
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/fs-vars/variables

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # short folder names: the build tree of the viewer has long paths
      - name: Legacy Viewer sources
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/phoenix-firestorm
          ref: ${{ env.FIRESTORM_SHA }}
          path: fs
      - name: Legacy Viewer build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          ref: ${{ env.BUILD_VARIABLES_SHA }}
          path: fs-vars
      # a pack is never replaced: viewers pin its archive
      - name: Release still free
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "media-plugins-$env:PACK_VERSION" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "media-plugins-$env:PACK_VERSION is already published: raise PACK_VERSION" }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Autobuild
        run: python -m pip install -r fs/requirements.txt
      # the open-source configuration: no KDU, FMOD nor Havok
      - name: Configure
        shell: bash
        working-directory: fs
        run: autobuild configure -c ReleaseFS_open -A 64
      - name: Build the launcher and the two plugins
        shell: pwsh
        working-directory: fs
        run: cmake --build build-vc170-64 --config Release --parallel --target SLPlugin media_plugin_cef media_plugin_libvlc
      - name: Package
        shell: pwsh
        run: |
          $dir = "Aurora-Media-Plugins-$env:PACK_VERSION-windows-x64"
          ./scripts/package-media-plugins.ps1 -Source fs -Build fs/build-vc170-64 -Out $dir -Version $env:PACK_VERSION
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          $hash = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content -LiteralPath "$dir.zip.sha256" -Encoding utf8NoBOM
          "{0}: {1} bytes, sha256 {2}" -f "$dir.zip", (Get-Item "$dir.zip").Length, $hash
          # the corresponding source of the LGPL binaries, published with them
          $src = "Aurora-Media-Plugins-$env:PACK_VERSION-source.tar.gz"
          git -C fs archive --format=tar.gz --prefix="phoenix-firestorm-$env:FIRESTORM_SHA/" -o "../$src" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          "PACK=$dir.zip" >> $env:GITHUB_ENV
          "SOURCE=$src" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: media-plugins-windows
          path: |
            ${{ env.PACK }}
            ${{ env.PACK }}.sha256
            ${{ env.SOURCE }}
          compression-level: 0

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Legacy Viewer sources
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/phoenix-firestorm
          ref: ${{ env.FIRESTORM_SHA }}
          path: fs
      - name: Legacy Viewer build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          ref: ${{ env.BUILD_VARIABLES_SHA }}
          path: fs-vars
      - name: Release still free
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "media-plugins-$PACK_VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "media-plugins-$PACK_VERSION is already published: raise PACK_VERSION"; exit 1
          fi
      # the prebuilt packages of the whole viewer and CEF take several GB
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      # GCC 14 and the system headers of the Legacy Viewer's Linux build
      # (.github/workflows/build_viewer.yml of the pinned commit)
      - name: Compiler and system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 python3-setuptools mesa-common-dev libgl1-mesa-dev libxinerama-dev \
            libxrandr-dev libpulse-dev libglu1-mesa-dev libfreetype6-dev libfontconfig1-dev
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Autobuild
        run: python -m pip install -r fs/requirements.txt
      - name: Configure
        working-directory: fs
        run: autobuild configure -c ReleaseFS_open -A 64
      - name: Build the launcher and the two plugins
        working-directory: fs
        run: cmake --build build-linux-x86_64 --parallel "$(nproc)" --target SLPlugin media_plugin_cef media_plugin_gstreamer10
      # zip (Info-ZIP) keeps the Unix permissions the viewer restores on
      # extraction: SLPlugin and dullahan_host stay executable
      - name: Package
        shell: pwsh
        run: |
          $dir = "Aurora-Media-Plugins-$env:PACK_VERSION-linux-x64"
          ./scripts/package-media-plugins.ps1 -Platform linux -Source fs -Build fs/build-linux-x86_64 -Out $dir -Version $env:PACK_VERSION
          & zip -r -q "$dir.zip" $dir
          if ($LASTEXITCODE -ne 0) { throw 'zip failed' }
          $hash = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content -LiteralPath "$dir.zip.sha256" -Encoding utf8NoBOM
          "{0}: {1} bytes, sha256 {2}" -f "$dir.zip", (Get-Item "$dir.zip").Length, $hash
          "PACK=$dir.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: media-plugins-linux
          path: |
            ${{ env.PACK }}
            ${{ env.PACK }}.sha256
          compression-level: 0

  # Xcode builds the universal binaries of the pinned commit
  # (build-darwin-universal); bash 4 and GNU sed as the Legacy Viewer's own
  # macOS job installs them (its .github/workflows/build_viewer.yml)
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Legacy Viewer sources
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/phoenix-firestorm
          ref: ${{ env.FIRESTORM_SHA }}
          path: fs
      - name: Legacy Viewer build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          ref: ${{ env.BUILD_VARIABLES_SHA }}
          path: fs-vars
      - name: Release still free
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "media-plugins-$PACK_VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "media-plugins-$PACK_VERSION is already published: raise PACK_VERSION"; exit 1
          fi
      - name: Bash and GNU sed
        run: |
          brew install bash gnu-sed
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Autobuild
        run: python -m pip install -r fs/requirements.txt
      - name: Configure
        working-directory: fs
        run: autobuild configure -c ReleaseFS_open -A 64
      - name: Build the launcher and the two plugins
        working-directory: fs
        run: cmake --build build-darwin-universal --config Release --parallel "$(sysctl -n hw.ncpu)" --target SLPlugin media_plugin_cef media_plugin_libvlc
      # zip (Info-ZIP) keeps the permissions the viewer restores on extraction
      - name: Package
        shell: pwsh
        run: |
          $dir = "Aurora-Media-Plugins-$env:PACK_VERSION-macos-universal"
          ./scripts/package-media-plugins.ps1 -Platform macos -Source fs -Build fs/build-darwin-universal -Out $dir -Version $env:PACK_VERSION
          & zip -r -q "$dir.zip" $dir
          if ($LASTEXITCODE -ne 0) { throw 'zip failed' }
          $hash = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content -LiteralPath "$dir.zip.sha256" -Encoding utf8NoBOM
          "{0}: {1} bytes, sha256 {2}" -f "$dir.zip", (Get-Item "$dir.zip").Length, $hash
          "PACK=$dir.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: media-plugins-macos
          path: |
            ${{ env.PACK }}
            ${{ env.PACK }}.sha256
          compression-level: 0

  publish:
    if: inputs.publish
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: media-plugins-*
          merge-multiple: true
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "media-plugins-$env:PACK_VERSION"
          $windows = "Aurora-Media-Plugins-$env:PACK_VERSION-windows-x64.zip"
          $linux = "Aurora-Media-Plugins-$env:PACK_VERSION-linux-x64.zip"
          $macos = "Aurora-Media-Plugins-$env:PACK_VERSION-macos-universal.zip"
          $source = "Aurora-Media-Plugins-$env:PACK_VERSION-source.tar.gz"
          $manifest = (& unzip -p $windows '*/aurora-media-plugins.json') -join "`n" | ConvertFrom-Json
          $notes = @(
              "Media plugins of Aurora Viewer, pack $env:PACK_VERSION (Windows x64, Linux x64 and macOS universal). The viewer downloads the archive of its system by itself when media need it; it checks its size and SHA-256 and installs it in the user's data folder."
              ''
              "- Windows: SLPlugin.exe, media_plugin_cef.dll and media_plugin_libvlc.dll; Linux: SLPlugin, libmedia_plugin_cef.so and libmedia_plugin_gstreamer.so; macOS: SLPlugin.app with media_plugin_cef.dylib and media_plugin_libvlc.dylib, signed ad hoc. Built from FirestormViewer/phoenix-firestorm@$env:FIRESTORM_SHA (LGPL 2.1); that source is attached ($source)."
              "- CEF / Dullahan $($manifest.packages.dullahan): Linden Lab's prebuilt packages (BSD-3-Clause for CEF, see LICENSES in the archives)."
              "- VLC $($manifest.packages.'vlc-bin') (Windows and macOS): Linden Lab's prebuilt package (LGPL 2.1+ for libvlc, see LICENSES/vlc.txt); source at https://download.videolan.org/pub/videolan/vlc/"
              '- Video on Linux plays through the GStreamer 1.0 of the system (gst-plugins-base, -good, -bad, -ugly and gst-libav for the usual codecs), as in the Legacy Viewer.'
              ''
              'This is not a viewer release: the viewer is in the releases tagged vX.Y.Z.'
          )
          $notes -join "`n" | Set-Content -LiteralPath notes.md -Encoding utf8NoBOM
          gh release create $tag $windows "$windows.sha256" $linux "$linux.sha256" $macos "$macos.sha256" $source --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Media plugins $env:PACK_VERSION" --notes-file notes.md --latest=false
