name: Measure CI deps (temporary)

# TEMPORARY, never merged: the measurement harness of the draft pull request
# of perf/ci-optimised-deps. It times the CI's test jobs with the
# dependencies built at another opt-level (`[profile.ci.package."*"]`), the
# workspace crates staying at 0, on the same hosted runners as the merge
# queue. The final commit of the branch removes this file.
#
# Second state, the warm runs: the first state's run (opened pull request)
# built the dependencies cold and saved one cache per opt-level, kept for
# this pull request only. This state runs on a push and reads those caches;
# a re-run of its run is one more sample. The cold jobs (clippy, Linux,
# macOS from nothing) ran once in the first state and are gone from here.
on:
  pull_request:
    types: [synchronize]

concurrency:
  group: measure-ci-deps-warm
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    # The three parts of ci.yml's tests job, for each opt-level. Build and
    # run are two steps here so that each has its own time.
    #
    # opt 0 is the control: main's cache and today's profile. opt 1 and 3
    # read the cache the first state's run saved for them: a warm queue run.
    name: m tests (opt ${{ matrix.opt }}, ${{ matrix.part }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # the organisation has 20 hosted jobs at once, the merge queue first:
      # three at a time, the three opt-levels of one part side by side
      max-parallel: 3
      matrix:
        part: [chat, interface, rest]
        opt: [0, 1, 3]
        include:
          - part: chat
            filter: "ui::chat::"
          - part: interface
            filter: "ui:: --skip ui::chat::"
          - part: rest
            filter: "--skip ui::"
    steps:
      - name: Every job runs (the control too)
        id: go
        shell: bash
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      # the hosted runners are not all the same machine: the processor says
      # which times compare
      - name: Runner's processor
        run: |
          (Get-CimInstance Win32_Processor).Name
          "logical processors: $env:NUMBER_OF_PROCESSORS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.go.outputs.run == 'true'
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Rust stable
        if: steps.go.outputs.run == 'true'
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Opt-level of the dependencies
        if: steps.go.outputs.run == 'true' && matrix.opt != 0
        shell: bash
        run: |
          mkdir -p .cargo
          printf '[profile.ci.package."*"]\nopt-level = %s\n' "${{ matrix.opt }}" > .cargo/config.toml
          cat .cargo/config.toml
      # control: main's cache, as the queue reads it today
      - name: Cache (main's, control)
        uses: ./.github/actions/rust-cache
        if: steps.go.outputs.run == 'true' && matrix.opt == 0
        with:
          name: tests
      # the cache the first state's run saved for this opt-level; nothing is
      # saved from here
      - name: Cache (this opt-level's)
        uses: ./.github/actions/rust-cache
        id: own
        if: steps.go.outputs.run == 'true' && matrix.opt != 0
        with:
          name: tests-opt${{ matrix.opt }}
      - name: Build the tests
        if: steps.go.outputs.run == 'true'
        run: cargo test --profile ci --workspace --locked --no-run
      - name: Tests (${{ matrix.part }})
        if: steps.go.outputs.run == 'true'
        run: cargo test --profile ci --workspace --locked -- ${{ matrix.filter }}
