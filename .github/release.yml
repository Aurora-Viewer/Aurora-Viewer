# Release notes generated from merged PRs, grouped by their type label
# (see scripts/setup-labels.ps1).
changelog:
  categories:
    - title: ⚠️ Breaking changes
      labels: [breaking]
    - title: ✨ New features
      labels: [feature]
    - title: 🐛 Fixes
      labels: [fix]
    - title: ⚡ Performance
      labels: [performance]
    - title: 🔧 Maintenance
      labels: [maintenance, dependencies]
    - title: 📚 Documentation
      labels: [docs]
    - title: Other changes
      labels: ['*']
