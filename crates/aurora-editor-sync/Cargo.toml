[package]
name = "aurora-editor-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3.4"
log = "0.4.34"
md5 = "0.8.1"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "net", "time", "sync", "macros"] }
# Server side only: no TLS (loopback), no client connector.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
uuid = { version = "1.27.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[lints]
workspace = true
