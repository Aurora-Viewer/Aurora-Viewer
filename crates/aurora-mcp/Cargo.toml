[package]
name = "aurora-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aurora-mcp-stdio"
path = "src/bin/stdio_proxy.rs"

[dependencies]
aurora-llsd = { version = "0.1.0", path = "../aurora-llsd" }
base64 = "0.23.1"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga", "gif", "webp"] }
log = "0.4.34"
parking_lot = "0.13.0"
png = "0.18.1"
regex = "1.12"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[lints]
workspace = true
