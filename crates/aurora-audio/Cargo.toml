[package]
name = "aurora-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Audio output engine for Aurora Viewer: volume-channel mixer, parcel music streaming, PCM sinks."

[dependencies]
sonora = "0.2.0"
aurora-version = { version = "0.1.0", path = "../aurora-version" }
# realtime: the device callbacks run in the multimedia scheduler's "Audio"
# task (MMCSS) on Windows, and at realtime priority on the ALSA host on Linux,
# so a busy viewer does not starve them. The PulseAudio host does not promote
# its callback thread: the server's own buffer (40 ms out, 40 ms in) absorbs
# the scheduling jitter instead.
# pulseaudio (Linux): the sound server's own sinks and sources, through a
# pure-Rust client of its protocol (no system library); PipeWire answers it
# through pipewire-pulse. cpal falls back to ALSA when no server runs.
cpal = { version = "0.18.2", features = ["realtime", "pulseaudio"] }
crossbeam-channel = "0.5.17"
log = "0.4.34"
parking_lot = "0.12.5"
rtrb = "0.4"
rustls = "0.23.45"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "wav", "pcm", "id3v2"] }
thiserror = "2.0.21"
url = "2"
webpki-root-certs = "1.0.9"

[lints]
workspace = true
