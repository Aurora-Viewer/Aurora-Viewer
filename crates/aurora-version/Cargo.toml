[package]
name = "aurora-version"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# No native library: `links` only lets the build script hand the resolved
# version to the build scripts of the crates that depend on this one
# (DEP_AURORA_VERSION_*), for the Windows resources of aurora-viewer.exe.
links = "aurora-version"

[build-dependencies]
semver = "1"

[dev-dependencies]
semver = "1"

[lints]
workspace = true
