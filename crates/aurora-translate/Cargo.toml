[package]
name = "aurora-translate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The llama.cpp backend (CPU); `vulkan` adds the GPU. Without them the
# translator answers NotBuilt.
llama = ["dep:llama-cpp-2"]
vulkan = ["llama", "llama-cpp-2/vulkan"]

[dependencies]
llama-cpp-2 = { version = "0.1.160", optional = true, default-features = false }
log = "0.4.34"
thiserror = "2.0.21"
crossbeam-channel = "0.5.17"
fs4 = "1.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
sha2 = "0.11.0"
whatlang = "0.18.0"

[lints]
workspace = true
