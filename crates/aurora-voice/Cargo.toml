[package]
name = "aurora-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Second Life WebRTC voice client for Aurora Viewer (receive and transmit)."

[dependencies]
# webrtc 0.21 callbacks are an `#[async_trait]` handler trait.
async-trait = "0.1.92"
aurora-audio = { version = "0.1.0", path = "../aurora-audio" }
aurora-llsd = { version = "0.1.0", path = "../aurora-llsd" }
bytes = "1"
glam = "0.34.1"
log = "0.4.34"
parking_lot = "0.12.5"
# Pure-Rust Opus encoder + decoder (no C toolchain); interoperates with libopus.
rusty-opus = "1.0.0"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Sans-I/O core of webrtc 0.21: media, codec and track types its async API
# takes but does not re-export. Crypto backend chosen by webrtc's features.
rtc = { version = "0.21.0", default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
uuid = { version = "1.27.0", features = ["v4"] }
webrtc = "0.21.0"

[dev-dependencies]
# Independent Opus decoder used by the tests to check what we send.
opus-decoder = "0.1.1"

[lints]
workspace = true
