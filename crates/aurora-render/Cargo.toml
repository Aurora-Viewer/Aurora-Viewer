[package]
name = "aurora-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aurora-llsd = { version = "0.1.0", path = "../aurora-llsd" }
bytemuck = { version = "1.25.2", features = ["derive"] }
# the Milky Way map's zlib (stars.rs), already built for aurora-assets
flate2 = "1.1.10"
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui-wgpu = "0.37.0"
glam = { version = "0.34.1", features = ["bytemuck"] }
log = "0.4.34"
parking_lot = "0.13.0"
pollster = "1.0.1"
thiserror = "2.0.21"
uuid = "1.27.0"
# counters: bytes of the live textures and buffers, for the memory budget (vram.rs)
wgpu = { version = "30.0.1", features = ["counters"] }
# naga at wgpu's version (one copy in Cargo.lock): the sample-mask SPIR-V
# workaround (spirv_fix.rs) writes the shader itself; `spirv` gives the
# opcodes its rewrite reads
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
spirv = "0.4"
bcdec_rs = "0.2.0"
intel_tex_2 = "0.5.0"

# Vulkan under wgpu: memory budget (vram.rs), texture pages in memory of
# their own (dedicated.rs); macOS draws through Metal instead
[target.'cfg(not(target_os = "macos"))'.dependencies]
ash = "0.38"

# Metal under wgpu: memory budget and size of the device (vram.rs); the
# version and the feature wgpu-hal uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLCommandQueue", "MTLTexture", "MTLPixelFormat"] }
# OpenXR's Metal path (xr_metal.rs) loads the installed loader
# (`AURORA_OPENXR_LOADER`): not validated yet, the built-in loader comes with
# that.
openxr = "0.22"

[target.'cfg(windows)'.dependencies]
# CPU time of a thread, for the profile (thread_cpu.rs)
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "linux")'.dependencies]
# CPU time of a thread, for the profile (thread_cpu.rs); already in the tree
libc = "0.2.190"

# Shared native OpenXR path (Vulkan on Linux/Windows, Metal on macOS): the
# system's loader is loaded at run time. The `xr-static-loader` feature builds
# the Khronos loader in instead (it needs CMake): the published Windows viewer
# uses it, since Windows runtimes seldom install a loader where an app finds it.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
openxr = "0.22"

[features]
xr-static-loader = ["openxr/static"]

[dev-dependencies]
# (`hlsl-out` and `msl-out` serve the tests that check the other writers of
# the sample mask route, oit_stochastic.rs)
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }
aurora-assets = { path = "../aurora-assets" }
rayon = "1.12.0"

[lints]
workspace = true
