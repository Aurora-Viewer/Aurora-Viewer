[package]
name = "aurora-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
log = "0.4.34"
parking_lot = "0.12.5"
pollster = "1.0.1"
thiserror = "2.0.21"
uuid = "1.27.0"
# counters: bytes of the live textures and buffers, for the memory budget (vram.rs)
wgpu = { version = "30.0.1", features = ["counters"] }
ash = "0.38"
bcdec_rs = "0.2.0"
intel_tex_2 = "0.5.0"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
aurora-assets = { path = "../aurora-assets" }
rayon = "1.12.0"

[lints]
workspace = true
