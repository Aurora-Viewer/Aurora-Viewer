[package]
name = "aurora-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aurora-updater = { version = "0.1.0", path = "../aurora-updater" }
aurora-i18n = { version = "0.1.0", path = "../aurora-i18n" }
anyhow = "1.0.104"
aurora-assets = { version = "0.1.0", path = "../aurora-assets" }
aurora-audio = { version = "0.1.0", path = "../aurora-audio" }
aurora-llsd = { version = "0.1.0", path = "../aurora-llsd" }
aurora-media = { version = "0.1.0", path = "../aurora-media" }
aurora-net = { version = "0.1.0", path = "../aurora-net" }
aurora-prim = { version = "0.1.0", path = "../aurora-prim" }
aurora-render = { version = "0.1.0", path = "../aurora-render" }
aurora-voice = { version = "0.1.0", path = "../aurora-voice" }
aurora-version = { version = "0.1.0", path = "../aurora-version" }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
egui = { version = "0.36.2", features = ["persistence"] }
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
emojis = "0.9.0"
env_logger = "0.11.11"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
log = "0.4.34"
# photos written row by row with their progress (the PNG encoder of image,
# already in the tree)
png = "0.18.1"
md5 = "0.8.1"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
pollster = "1.0.1"
# CommonMark parsing for notecard previews; MIT licensed, no HTML runtime.
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rayon = "1.12.0"
resvg = "0.48"
# native file dialogs (About Land: export / import of access lists)
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
softbuffer = "0.4.8"
sha2 = "0.11.0"
ttf-parser = "0.25.1"
uuid = { version = "1.27.0", features = ["v4"] }
wgpu = "30.0.1"
winit = "0.30"
ron = "0.12.2"
flate2 = "1.1.10"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
serde_path_to_error = "0.1.20"
# MikkTSpace tangents of the meshes' normal maps (scene/tangents.rs): safe
# Rust, no dependency, byte-identical to the reference C code; MIT /
# Apache-2.0 with the reference's zlib notice
bevy_mikktspace = "1.0.0"

# remembered login password (Windows Credential Manager, macOS Keychain,
# Secret Service on Linux)
[dependencies.keyring]
version = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_WindowsProgramming"] }

# icon and version block of aurora-viewer.exe (build.rs; runs rc.exe of the
# Windows SDK). Without `toml`: nothing is read from Cargo.toml.
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints]
workspace = true
