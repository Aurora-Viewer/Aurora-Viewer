[package]
name = "aurora-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
aurora-assets = { version = "0.1.0", path = "../aurora-assets" }
aurora-audio = { version = "0.1.0", path = "../aurora-audio" }
aurora-llsd = { version = "0.1.0", path = "../aurora-llsd" }
aurora-media = { version = "0.1.0", path = "../aurora-media" }
aurora-net = { version = "0.1.0", path = "../aurora-net" }
aurora-prim = { version = "0.1.0", path = "../aurora-prim" }
aurora-render = { version = "0.1.0", path = "../aurora-render" }
aurora-voice = { version = "0.1.0", path = "../aurora-voice" }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
egui = { version = "0.36.2", features = ["persistence"] }
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
emojis = "0.9.0"
env_logger = "0.11.11"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.34"
md5 = "0.8.1"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
pollster = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rayon = "1.12.0"
resvg = "0.48"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ttf-parser = "0.25.1"
uuid = { version = "1.27.0", features = ["v4"] }
wgpu = "30.0.1"
winit = "0.30"
ron = "0.12.2"
flate2 = "1.1.10"
tokio = { version = "1", default-features = false, features = ["rt"] }

# remembered login password (Windows Credential Manager, macOS Keychain,
# Secret Service on Linux)
[dependencies.keyring]
version = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true
