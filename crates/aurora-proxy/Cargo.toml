[package]
name = "aurora-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
log = "0.4.34"
# `socks`: SOCKS 5 proxies for the HTTP clients, implemented by hyper-util
# (already in the tree): the feature adds no crate.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["net", "io-util", "time", "rt", "macros", "sync"] }

[lints]
workspace = true
