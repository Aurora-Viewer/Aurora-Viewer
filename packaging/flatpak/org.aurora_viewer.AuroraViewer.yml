# Flatpak of Aurora Viewer: the Linux release archive (the same viewer as
# Aurora-Viewer-<version>-linux-x64.tar.gz) repackaged with its desktop
# entry, icon, AppStream data and sandbox permissions. Nothing is compiled
# here: scripts/package-flatpak.sh stages the archive next to a copy of this
# manifest as aurora-viewer-linux-x64.tar.gz, then builds the bundle. See
# docs/LINUX.md, "Flatpak".
#
# The id is the viewer's D-Bus name (slurl_handoff.rs), which a Flatpak may
# own without a --own-name permission; the window takes it as its Wayland
# app_id from FLATPAK_ID (cli.rs desktop_id).
id: org.aurora_viewer.AuroraViewer
# the archive is built on Ubuntu 24.04 (glibc 2.39): any current runtime
# runs it
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: aurora-viewer
finish-args:
  # grid, assets, voice, web pages
  - --share=network
  - --share=ipc
  - --socket=wayland
  # X11 as well, not fallback-x11: the clipboard (arboard, through
  # egui-winit) needs a Wayland data-control protocol that sandboxed clients
  # do not get from every compositor (KWin), and then falls back to X11.
  # With fallback-x11 that socket is hidden under Wayland, and copy / paste
  # stop working.
  - --socket=x11
  # Vulkan
  - --device=dri
  # gamepads (gilrs); a SpaceMouse (hidapi, /dev/hidraw*) needs
  # `flatpak override --user --device=all org.aurora_viewer.AuroraViewer`
  - --device=input
  # sound and the voice microphone
  - --socket=pulseaudio
  # "Remember password" and the two-factor choice (the Secret Service)
  - --talk-name=org.freedesktop.secrets
  # desktop notices (system_notify.rs talks to the server itself)
  - --talk-name=org.freedesktop.Notifications
  # photos are saved to the pictures folder without a dialog
  - --filesystem=xdg-pictures
modules:
  - name: aurora-viewer
    buildsystem: simple
    build-options:
      # the archive's binary is already built and stripped of debug info
      no-debuginfo: true
      strip: false
    sources:
      - type: archive
        path: aurora-viewer-linux-x64.tar.gz
        dest: viewer
      - type: file
        path: org.aurora_viewer.AuroraViewer.desktop
      - type: file
        path: org.aurora_viewer.AuroraViewer.metainfo.xml
      - type: file
        path: org.aurora_viewer.AuroraViewer.svg
    build-commands:
      # the archive's folder as it is (licences, notices and assets stay
      # next to the executable), without the entry and icon of the plain
      # archive: the Flatpak installs its own below
      - mkdir -p /app/lib /app/bin
      - cp -a viewer /app/lib/aurora-viewer
      - rm -f /app/lib/aurora-viewer/aurora-viewer.desktop /app/lib/aurora-viewer/aurora-viewer.svg
      - ln -s ../lib/aurora-viewer/aurora-viewer /app/bin/aurora-viewer
      - install -Dm644 org.aurora_viewer.AuroraViewer.desktop -t /app/share/applications
      - install -Dm644 org.aurora_viewer.AuroraViewer.metainfo.xml -t /app/share/metainfo
      - install -Dm644 org.aurora_viewer.AuroraViewer.svg -t /app/share/icons/hicolor/scalable/apps
