[workspace]
resolver = "2"
members = ["crates/*"]
# LOCAL ONLY (task rt-shadows, step 0): the local wgpu fork keeps its own workspace.
exclude = [".scratch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Aurora-Viewer/Aurora-Viewer"
publish = false

# The single local profile: check.ps1 (clippy, tests) and the demo runs share
# it, so a worktree compiles everything once. It behaves like the shipped
# build (no debug assertions or overflow checks, no console window) and only
# skips the slow LTO of --release, kept for releases and performance work.
# Debug info: line tables only (function names and line numbers in crash
# stacks, without the gigabytes of full debug info in target/).
[profile.dev]
opt-level = 1
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3

# The one exception to the single profile: the viewer crate's own test
# executable, the heaviest compile of the workspace, is built without
# optimisation. It only runs the tests, and the CI builds them unoptimised
# too. Its debug info stays the one of `dev` (line tables), so a failing test
# keeps files and lines in its backtrace. Cargo builds nothing else
# differently: the dependencies, the other crates and the viewer of
# `cargo run` keep the profile above.
[profile.test.package.aurora-viewer]
opt-level = 0

# CI (clippy, tests): the workspace's crates are compiled fast rather than
# running fast; keeps the debug assertions and overflow checks as an extra
# net for the tests.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
incremental = false

# The dependencies are optimised a little. They come from the Rust cache and
# are rebuilt only when Cargo.lock or the Rust version changes, and the
# viewer's interface tests spend most of their time in them: on the same
# hosted runner those tests take 158 s instead of 566 s. 1 and not 3: the
# tests run as fast, and a cache built from nothing costs less (TASKS.md,
# task `ci-optimised-deps`, has the measures). Without this section `ci`
# would inherit the 3 of `dev`.
[profile.ci.package."*"]
opt-level = 1

# "Debug viewer" of aurora-tools.cmd (target\debugging): a console window,
# debug assertions and overflow checks, full debug info for Aurora's own
# crates (line tables only for the dependencies, to keep it to a few GB).
[profile.debugging]
inherits = "dev"
debug = "full"
debug-assertions = true
overflow-checks = true

[profile.debugging.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 16

# Shared lints: every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Render passes and GPU setup legitimately take many parameters and
# nested tuple types; splitting them would not make the code clearer.
too_many_arguments = "allow"
type_complexity = "allow"

# wgpu 30.0.1 with one upstream fix only, until a wgpu release has it
# (31, or a 30.0.x that carries it): gfx-rs/wgpu#10124, a Vulkan descriptor pool with
# `poolSizeCount = 0` that the Intel driver of 6th to 9th generation
# integrated GPUs (`igvk64`) reads past and crashes on at every start
# (#1302). The organisation's fork `Aurora-Viewer/wgpu` holds the branch
# `aurora/v30.0.1-empty-pool`: the v30.0.1 tag plus that commit (11 lines in
# wgpu-hal), pinned by `rev`; never delete or rewrite that branch. The whole
# family comes from it, so the crates keep sharing one `wgpu-types` and one
# `naga`. Remove this section with the upgrade.
# LOCAL ONLY (task rt-shadows, step 0): the fork with the TLAS instance flags,
# from .scratch/wgpu (branch aurora/rt-instance-flags). Not for a commit.
[patch.crates-io]
naga = { path = ".scratch/wgpu/naga" }
naga-types = { path = ".scratch/wgpu/naga-types" }
wgpu = { path = ".scratch/wgpu/wgpu" }
wgpu-core = { path = ".scratch/wgpu/wgpu-core" }
wgpu-core-deps-apple = { path = ".scratch/wgpu/wgpu-core/platform-deps/apple" }
wgpu-core-deps-emscripten = { path = ".scratch/wgpu/wgpu-core/platform-deps/emscripten" }
wgpu-core-deps-wasm = { path = ".scratch/wgpu/wgpu-core/platform-deps/wasm" }
wgpu-core-deps-windows-linux-android = { path = ".scratch/wgpu/wgpu-core/platform-deps/windows-linux-android" }
wgpu-hal = { path = ".scratch/wgpu/wgpu-hal" }
wgpu-naga-bridge = { path = ".scratch/wgpu/wgpu-naga-bridge" }
wgpu-types = { path = ".scratch/wgpu/wgpu-types" }
