[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/odessadraekavik/Aurora_Viewer"
publish = false

# Debug info: line tables only (function names and line numbers in crash
# stacks, without the gigabytes of full debug info in target/).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# CI (clippy, tests): compiled fast rather than running fast.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 0

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 16

# Shared lints: every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Render passes and GPU setup legitimately take many parameters and
# nested tuple types; splitting them would not make the code clearer.
too_many_arguments = "allow"
type_complexity = "allow"
